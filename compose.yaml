services:
  app:
    build:
      context: .
      target: sampleapp
    ports:
      - "127.0.0.1:3000:3000"

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      app:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://app:3000
      E2E_EMAIL: tester@example.com
      E2E_PASSWORD: sample-password
      E2E_CONCURRENCY: "${E2E_CONCURRENCY:-4}"
