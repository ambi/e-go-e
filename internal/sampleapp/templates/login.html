<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ログイン</title></head>
<body>
  <h1>ログイン</h1>
  {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
  <form id="login" action="/session" method="post">
    <input type="hidden" name="authenticity_token" value="{{.CSRF}}">
    <p><label>メールアドレス <input type="email" name="user[email]" autocomplete="username" required></label></p>
    <p><label>パスワード <input type="password" name="user[password]" autocomplete="current-password" required></label></p>
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
